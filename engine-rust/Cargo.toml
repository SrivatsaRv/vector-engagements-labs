[package]
name = "vector-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Deterministic browser-first 3DOF simulation engine for Vector Engagement Labs"
repository = "https://github.com/SrivatsaRv/vector-engagements-labs"
homepage = "https://labs.reachdefence.com"
license = "Apache-2.0"
readme = "README.md"
keywords = ["simulation", "webassembly", "aerospace", "three-dof"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10.9", default-features = false }

[profile.release]
codegen-units = 1
lto = true
# The production browser engine remains below its 550 kB regional-environment gate.
# Verification-only evaluators are owned by separate crates and artifacts.
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = true

[profile.release.package."*"]
# The simulation crate retains the checked-arithmetic release policy above.
# Third-party JSON/hash dependencies use their standard release overflow
# behavior, avoiding duplicate generic checks in the bounded browser artifact.
overflow-checks = false
