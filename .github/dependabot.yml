version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # #63 temporarily freezes the exact last-known-good Cloudflare browser
      # toolchain while workers-sdk#15252 remains unreleased. The governed
      # removal/revalidation contract is browser-toolchain-compatibility.v1.
      - dependency-name: "@cloudflare/vite-plugin"
      - dependency-name: "@cloudflare/workers-types"
      - dependency-name: "wrangler"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "javascript"]
  - package-ecosystem: cargo
    directory: /engine-rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      cargo-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "rust"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-maintenance:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "github-actions"]
