version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # These two packages are upgraded together only after the responsive
      # integration suite proves the Cloudflare local runtime is compatible.
      - dependency-name: "@cloudflare/vite-plugin"
      - dependency-name: "wrangler"
    labels: ["dependencies", "javascript"]
  - package-ecosystem: cargo
    directory: /engine-rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      cargo-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "rust"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-maintenance:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "github-actions"]
