name: Bug report
description: Report a reproducible defect in the application or engine
title: "[Bug]: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private data, or operationally sensitive information.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scenario construction
        - TypeScript engine
        - Rust/WASM engine
        - Map or 3D playback
        - RASP or sensors
        - Telemetry or report
        - Database or API
        - Build or deployment
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest deterministic sequence, scenario, backend, and inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, record, or screenshots
      description: Remove secrets and private data.
