name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify or deploy the exact Worker candidate produced by main CI
        required: true
        type: choice
        default: verify
        options:
          - verify
          - deploy
      ref:
        description: Full 40-character commit SHA from reviewed main history
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  admit:
    if: github.ref == 'refs/heads/main'
    name: Admit CI-built Worker candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ci_run_id: ${{ steps.admission.outputs.ci_run_id }}
      sha: ${{ steps.admission.outputs.sha }}
    steps:
      - name: Require an immutable CI-green main candidate
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Production operations require a full 40-character commit SHA." >&2
            exit 1
          fi
          comparison_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${REQUESTED_REF}...main" --jq '.status')"
          if [[ "${comparison_status}" != "ahead" && "${comparison_status}" != "identical" ]]; then
            echo "Requested revision is not contained in main." >&2
            exit 1
          fi

          ci_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=${REQUESTED_REF}&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.run_attempt) | last | .id // empty')"
          test -n "${ci_run_id}"

          artifact_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}/artifacts?per_page=100" \
            --jq "[.artifacts[] | select(.name == \"cloudflare-worker-${REQUESTED_REF}\" and .expired == false)] | length")"
          test "${artifact_count}" -eq 1
          echo "ci_run_id=${ci_run_id}" >> "${GITHUB_OUTPUT}"
          echo "sha=${REQUESTED_REF}" >> "${GITHUB_OUTPUT}"

  promote:
    name: Verify and promote CI-built Worker
    needs: admit
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download exact CI candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.admit.outputs.ci_run_id }}
          name: cloudflare-worker-${{ needs.admit.outputs.sha }}
          path: candidate
      - name: Check out trusted release scripts only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.admit.outputs.sha }}
          path: .trusted-release
          sparse-checkout: |
            scripts/lib/cloudflare-candidate.mjs
            scripts/prepare-cloudflare-deployment.mjs
            scripts/verify-cloudflare-candidate.mjs
          sparse-checkout-cone-mode: false
      - name: Set up deployment runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
      - name: Require production bindings and verify candidate bytes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
          VECTOR_PRODUCTION_HOST: ${{ vars.VECTOR_PRODUCTION_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_ORIGIN_URL }}
          VECTOR_SOURCE_SHA: ${{ needs.admit.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_HYPERDRIVE_ID}"
          test -n "${VECTOR_PRODUCTION_HOST}"
          test -n "${DATABASE_URL}"
          node .trusted-release/scripts/verify-cloudflare-candidate.mjs candidate "${VECTOR_SOURCE_SHA}"
          node .trusted-release/scripts/prepare-cloudflare-deployment.mjs \
            candidate \
            "${VECTOR_SOURCE_SHA}" \
            candidate/release/wrangler.json
      - name: Verify production migration compatibility without mutation
        working-directory: candidate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_ORIGIN_URL }}
        run: node dist/admin/verify-db-migration-ledger.mjs
      - name: Verify Hyperdrive configuration
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.113.0
          command: hyperdrive get ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
      - name: Apply forward-only migrations and verify catalog
        if: inputs.operation == 'deploy'
        working-directory: candidate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_ORIGIN_URL }}
        run: |
          set -euo pipefail
          node dist/admin/verify-db-migration-ledger.mjs
          node dist/admin/migrate-db.mjs
          node dist/admin/verify-db.mjs --production-read-only
      - name: Deploy exact CI candidate without rebuilding
        if: inputs.operation == 'deploy'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.113.0
          workingDirectory: candidate
          command: deploy --config release/wrangler.json --no-bundle --strict --no-autoconfig --message source:${{ needs.admit.outputs.sha }}
      - name: Verify deployed application and static assets
        if: inputs.operation == 'deploy'
        env:
          VECTOR_PRODUCTION_HOST: ${{ vars.VECTOR_PRODUCTION_HOST }}
        run: |
          set -euo pipefail
          origin="https://${VECTOR_PRODUCTION_HOST}"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --max-time 15 "${origin}/api/health"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --max-time 15 "${origin}/api/catalog" > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-all-errors --max-time 15 "${origin}/scenarios" > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-all-errors --max-time 15 "${origin}/workbench?scenario=a2a-crossing-intercept" > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-all-errors --max-time 15 "${origin}/vendor/maplibre/maplibre-gl-worker.mjs" > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-all-errors --max-time 15 "${origin}/vendor/maplibre/maplibre-gl-shared.mjs" > /dev/null
