name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only verification or deployment of an immutable reviewed revision
        required: true
        type: choice
        default: verify
        options:
          - verify
          - deploy
      ref:
        description: Full 40-character commit SHA from reviewed main history
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  admit:
    if: github.ref == 'refs/heads/main'
    name: Admit immutable reviewed revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.admission.outputs.sha }}
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Require immutable CI-green main revision
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Production operations require a full 40-character commit SHA." >&2
            exit 1
          fi
          git fetch origin main --no-tags
          test "$(git rev-parse "${REQUESTED_REF}^{commit}")" = "${REQUESTED_REF}"
          git merge-base --is-ancestor "${REQUESTED_REF}" origin/main
          gate_count="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REQUESTED_REF}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "Stage 4: Required PR Gate" and .conclusion == "success")] | length')"
          test "${gate_count}" -ge 1
          echo "sha=${REQUESTED_REF}" >> "${GITHUB_OUTPUT}"

  verify:
    name: Verify production dependencies read-only
    needs: admit
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out admitted revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.admit.outputs.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.97.1
          target: wasm32-unknown-unknown
          components: clippy,rustfmt
      - name: Install locked dependencies
        run: npm ci
      - name: Require production bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
          VECTOR_PRODUCTION_HOST: ${{ vars.VECTOR_PRODUCTION_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_ORIGIN_URL }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_HYPERDRIVE_ID}"
          test -n "${VECTOR_PRODUCTION_HOST}"
          test -n "${DATABASE_URL}"
      - name: Verify Hyperdrive configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
        run: npx wrangler hyperdrive get "${CLOUDFLARE_HYPERDRIVE_ID}"
      - name: Verify admitted source
        run: make ci-local
      - name: Verify production catalog without mutation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_ORIGIN_URL }}
        run: npm run db:verify

  migrate:
    if: inputs.operation == 'deploy'
    name: Apply forward-only production migrations
    needs:
      - admit
      - verify
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out admitted revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.admit.outputs.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Migrate and verify production catalog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_ORIGIN_URL }}
        run: |
          npm run db:migrate
          npm run db:verify

  deploy:
    if: inputs.operation == 'deploy'
    name: Deploy immutable production Worker
    needs:
      - admit
      - migrate
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out admitted revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.admit.outputs.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Deploy immutable source revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
          VECTOR_PRODUCTION_HOST: ${{ vars.VECTOR_PRODUCTION_HOST }}
        run: npm run deploy

  smoke:
    if: inputs.operation == 'deploy'
    name: Verify deployed health
    needs: deploy
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify deployed health
        env:
          VECTOR_PRODUCTION_HOST: ${{ vars.VECTOR_PRODUCTION_HOST }}
        run: |
          set -euo pipefail
          test -n "${VECTOR_PRODUCTION_HOST}"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --max-time 15 "https://${VECTOR_PRODUCTION_HOST}/api/health"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --max-time 15 "https://${VECTOR_PRODUCTION_HOST}/blogs" > /dev/null
