name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify production dependencies or deploy an immutable revision
        required: true
        type: choice
        default: verify
        options:
          - verify
          - deploy
      ref:
        description: Revision to verify; production deploys require a full commit SHA
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production Worker
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out requested release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref }}
      - name: Require immutable production revision
        if: inputs.operation == 'deploy'
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          if [[ ! "${REQUESTED_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Production deployment requires a full 40-character commit SHA." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${REQUESTED_REF}"
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - name: Install locked dependencies
        run: npm ci
      - name: Require production bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
          VECTOR_PRODUCTION_HOST: ${{ vars.VECTOR_PRODUCTION_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_ORIGIN_URL }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_HYPERDRIVE_ID}"
          test -n "${VECTOR_PRODUCTION_HOST}"
          test -n "${DATABASE_URL}"
      - name: Verify Hyperdrive configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
        run: npx wrangler hyperdrive get "${CLOUDFLARE_HYPERDRIVE_ID}"
      - name: Verify release
        run: make ci-local
      - name: Migrate and verify production catalog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_ORIGIN_URL }}
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:verify
      - name: Deploy immutable source revision
        if: inputs.operation == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
          VECTOR_PRODUCTION_HOST: ${{ vars.VECTOR_PRODUCTION_HOST }}
        run: npm run deploy
