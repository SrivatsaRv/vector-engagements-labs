name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: engine-rust
      - name: Install locked dependencies
        run: npm ci
      - name: Run commit gate
        run: make ci-local

  integration:
    name: Integration gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Locate Chrome
        run: test -x /usr/bin/google-chrome
      - name: Verify PostGIS, API, reports, maps, and responsive UI
        env:
          VECTOR_CHROME_PATH: /usr/bin/google-chrome
        run: make integration-local
      - name: Report Compose state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=250
      - name: Upload responsive evidence on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: responsive-failure-evidence
          path: outputs/responsive
          if-no-files-found: ignore
          retention-days: 7

  performance:
    name: Performance gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run engine benchmark guard
        env:
          VECTOR_MAX_ENGINE_P95_MS: "200"
        run: make performance-local | tee performance.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: engine-performance
          path: performance.json
          retention-days: 30
