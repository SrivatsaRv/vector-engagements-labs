name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: "Stage 0: Classify Changed Contracts"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      policy: ${{ steps.changes.outputs.policy }}
      quality: ${{ steps.changes.outputs.quality }}
      security_js: ${{ steps.changes.outputs.security_js }}
      web_tests: ${{ steps.changes.outputs.web_tests }}
      browser_tests: ${{ steps.changes.outputs.browser_tests }}
      source_evidence: ${{ steps.changes.outputs.source_evidence }}
      rust_tests: ${{ steps.changes.outputs.rust_tests }}
      rust_audit: ${{ steps.changes.outputs.rust_audit }}
      integration: ${{ steps.changes.outputs.integration }}
      container: ${{ steps.changes.outputs.container }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${BASE_SHA}" =~ ^0+$ ]]; then
            EMPTY_TREE="$(git hash-object -t tree /dev/null)"
            MERGE_BASE="${EMPTY_TREE}"
          else
            MERGE_BASE="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          fi
          git diff --name-status -z --find-renames --find-copies --find-copies-harder "${MERGE_BASE}" "${HEAD_SHA}" |
            node scripts/classify-ci-changes.mjs --name-status0

  policy:
    name: "Stage 0.5: Repository Policy"
    needs: classify
    outputs:
      pr_review_kind: ${{ steps.pr_closure.outputs.kind }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
      - name: Classify governed parent-issue closure
        id: pr_closure
        run: node scripts/verify-pr-closure-governance.mjs
      - name: Verify harness, classifier, workflow, deployment, and persona policies
        run: |
          npm run policy:runtime-stubs:verify
          node --test \
            tests/harness-execution.test.mjs \
            tests/ci-change-classifier.test.mjs \
            tests/deployment-config.test.mjs \
            tests/persona-skills.test.mjs \
            tests/pr-closure-governance.test.mjs \
            tests/required-pr-gate.test.mjs \
            tests/runtime-stub-ledger.test.mjs \
            tests/security-config.test.mjs

  quality:
    if: needs.classify.outputs.quality == 'true'
    name: "Stage 1A: Web Quality"
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Set up Rust formatting toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Install locked dependencies
        run: npm ci
      - name: Verify generated assets, lint, and types
        run: make ci-quality-core

  security_js:
    if: needs.classify.outputs.security_js == 'true'
    name: "Stage 1B: JavaScript Supply Chain and CodeQL"
    needs: classify
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:production
      - name: Review pull-request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          languages: javascript-typescript
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          category: /language:javascript-typescript

  web_tests:
    if: needs.classify.outputs.web_tests == 'true'
    name: "Stage 2A: Web and Contract Tests"
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and run JavaScript and TypeScript contracts
        run: npm test

  rust_tests:
    if: needs.classify.outputs.rust_tests == 'true'
    name: "Stage 2B: Rust, WASM, and Parity"
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.97.1
          target: wasm32-unknown-unknown
          components: clippy,rustfmt
      - name: Install locked dependencies
        run: npm ci
      - name: Remove cached Rust outputs before reproducibility checks
        run: |
          cargo clean --manifest-path engine-rust/Cargo.toml
          cargo clean --manifest-path verification-rust/generic-aam/Cargo.toml
          cargo clean --manifest-path verification-rust/tp1538-aero/Cargo.toml
      - name: Verify Rust, WASM, and parity contracts
        run: |
          npm run engine:rust:fmt
          npm run engine:rust:clippy
          npm run engine:rust:verify
          npm run engine:rust:test
          npm run engine:rust:doc
          npm run reference-aam:rust:fmt
          npm run reference-aam:rust:clippy
          npm run reference-aam:rust:verify
          npm run reference-aam:rust:test
          npm run reference-aam:rust:doc
          npm run tp1538:aero:rust:fmt
          npm run tp1538:aero:rust:clippy
          npm run tp1538:aero:rust:verify
          npm run tp1538:aero:rust:test
          npm run tp1538:aero:rust:doc
          node --test tests/engine-backends.test.mjs tests/model-pack.test.mjs

  browser_tests:
    if: needs.classify.outputs.browser_tests == 'true'
    name: "Stage 2D: Browser Contract"
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run component and built-browser contracts
        run: |
          npm run test:component
          npm run test:browser:ci
          npm run worker:verify
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: browser-contract-evidence
          path: outputs/
          if-no-files-found: ignore
          retention-days: 7

  source_evidence:
    if: needs.classify.outputs.source_evidence == 'true'
    name: "Stage 2E: Source Evidence Reproduction"
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Restore the content-keyed renderer image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.tool_cache }}/vector-poppler-26.05.0-ubuntu24-amd64
          key: vector-poppler-ubuntu24-amd64-${{ hashFiles('scripts/install-pinned-poppler-ubuntu.sh', 'scripts/pinned-poppler-ubuntu.Dockerfile', 'scripts/pinned-pdftoppm-wrapper.sh.in') }}
      - name: Install the pinned offline source renderer
        run: scripts/install-pinned-poppler-ubuntu.sh
      - name: Verify source bytes and reproduce selected pages
        run: |
          npm run generic-sensor:sources:verify
          npm run policy:nasa-f16-store-source:verify
          npm run source-evidence:render-verify

  rust_audit:
    if: needs.classify.outputs.rust_audit == 'true'
    name: "Stage 2C: Rust Dependency Audit"
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.97.1
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit locked Rust dependencies
        run: make rust-audit-local

  integration:
    if: needs.classify.outputs.integration == 'true'
    name: "Stage 3A: Database and API Integration"
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_DB: vector
          POSTGRES_USER: vector
          POSTGRES_PASSWORD: vector
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U vector -d vector"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://vector:vector@127.0.0.1:55433/vector
      VECTOR_URL: http://127.0.0.1:4317
      PORT: "4317"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build application
        run: |
          npm run build
          npm run generic-sensor:sources:verify
          npm run policy:nasa-f16-store-source:verify
      - name: Verify PostGIS, migrations, API, and saved reports
        run: make integration-ci
      - name: Upload application log on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: integration-application-log
          path: outputs/integration/
          if-no-files-found: ignore
          retention-days: 7

  container:
    if: needs.classify.outputs.container == 'true'
    name: "Stage 3B: Container Rebuild"
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Rebuild the application image from source
        run: docker build --tag "vector-lab-ci:${GITHUB_SHA}" .

  gate:
    if: always()
    name: "Stage 4: Required PR Gate"
    needs:
      - classify
      - policy
      - quality
      - security_js
      - web_tests
      - browser_tests
      - source_evidence
      - rust_tests
      - rust_audit
      - integration
      - container
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      POLICY_RESULT: ${{ needs.policy.result }}
      PR_REVIEW_KIND: ${{ needs.policy.outputs.pr_review_kind }}
      QUALITY_SELECTED: ${{ needs.classify.outputs.quality }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      SECURITY_JS_SELECTED: ${{ needs.classify.outputs.security_js }}
      SECURITY_JS_RESULT: ${{ needs.security_js.result }}
      WEB_TESTS_SELECTED: ${{ needs.classify.outputs.web_tests }}
      WEB_TESTS_RESULT: ${{ needs.web_tests.result }}
      BROWSER_TESTS_SELECTED: ${{ needs.classify.outputs.browser_tests }}
      BROWSER_TESTS_RESULT: ${{ needs.browser_tests.result }}
      SOURCE_EVIDENCE_SELECTED: ${{ needs.classify.outputs.source_evidence }}
      SOURCE_EVIDENCE_RESULT: ${{ needs.source_evidence.result }}
      RUST_TESTS_SELECTED: ${{ needs.classify.outputs.rust_tests }}
      RUST_TESTS_RESULT: ${{ needs.rust_tests.result }}
      RUST_AUDIT_SELECTED: ${{ needs.classify.outputs.rust_audit }}
      RUST_AUDIT_RESULT: ${{ needs.rust_audit.result }}
      INTEGRATION_SELECTED: ${{ needs.classify.outputs.integration }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
      CONTAINER_SELECTED: ${{ needs.classify.outputs.container }}
      CONTAINER_RESULT: ${{ needs.container.result }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
      - name: Verify every selected gate passed
        run: node scripts/verify-required-gates.mjs

  cloudflare_candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: "Publish reusable Cloudflare candidate"
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_HYPERDRIVE_ID: "11111111111111111111111111111111"
      VECTOR_PRODUCTION_HOST: vector-candidate.invalid
    steps:
      - name: Check out admitted main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build the deployable Worker once
        run: |
          npm run build
          node --test tests/cloudflare-build-output.test.mjs
          npm run deploy:artifact:verify
          node scripts/create-cloudflare-candidate.mjs --source-sha "${GITHUB_SHA}"
          node scripts/verify-cloudflare-candidate.mjs outputs/cloudflare-candidate "${GITHUB_SHA}"
      - name: Upload immutable Worker candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: cloudflare-worker-${{ github.sha }}
          path: outputs/cloudflare-candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
