name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: "Stage 0: Classify Changed Contracts"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      policy: ${{ steps.changes.outputs.policy }}
      quality: ${{ steps.changes.outputs.quality }}
      security_js: ${{ steps.changes.outputs.security_js }}
      web_tests: ${{ steps.changes.outputs.web_tests }}
      rust_tests: ${{ steps.changes.outputs.rust_tests }}
      rust_audit: ${{ steps.changes.outputs.rust_audit }}
      integration: ${{ steps.changes.outputs.integration }}
      container: ${{ steps.changes.outputs.container }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${BASE_SHA}" =~ ^0+$ ]]; then
            git show --pretty= --name-only -z "${HEAD_SHA}"
          else
            git diff --name-only -z "${BASE_SHA}" "${HEAD_SHA}"
          fi | node scripts/classify-ci-changes.mjs --stdin0

  policy:
    name: "Stage 0.5: Repository Policy"
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
      - name: Verify classifier, workflow, deployment, and persona policies
        run: >-
          node --test
          tests/ci-change-classifier.test.mjs
          tests/deployment-config.test.mjs
          tests/persona-skills.test.mjs
          tests/security-config.test.mjs

  quality:
    if: needs.classify.outputs.quality == 'true'
    name: "Stage 1A: Web Quality"
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify generated assets, lint, and types
        run: |
          npm run symbols:verify
          npm run models:verify
          npm run lint
          npm run typecheck

  security_js:
    if: needs.classify.outputs.security_js == 'true'
    name: "Stage 1B: JavaScript Supply Chain and CodeQL"
    needs: classify
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:production
      - name: Review pull-request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43
        with:
          languages: javascript-typescript
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43
        with:
          category: /language:javascript-typescript

  web_tests:
    if: needs.classify.outputs.web_tests == 'true'
    name: "Stage 2A: Web and Contract Tests"
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and run JavaScript and TypeScript contracts
        run: npm test

  rust_tests:
    if: needs.classify.outputs.rust_tests == 'true'
    name: "Stage 2B: Rust, WASM, and Parity"
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: clippy,rustfmt
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: engine-rust
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Rust, WASM, and parity contracts
        run: |
          npm run engine:rust:fmt
          npm run engine:rust:clippy
          npm run engine:rust:verify
          npm run engine:rust:test
          npm run engine:rust:doc
          node --test tests/engine-backends.test.mjs tests/model-pack.test.mjs

  rust_audit:
    if: needs.classify.outputs.rust_audit == 'true'
    name: "Stage 2C: Rust Dependency Audit"
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit locked Rust dependencies
        run: cargo audit --file engine-rust/Cargo.lock

  integration:
    if: needs.classify.outputs.integration == 'true'
    name: "Stage 3A: Database and API Integration"
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_DB: vector
          POSTGRES_USER: vector
          POSTGRES_PASSWORD: vector
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U vector -d vector"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://vector:vector@127.0.0.1:55433/vector
      VECTOR_URL: http://127.0.0.1:4317
      PORT: "4317"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Verify PostGIS, migrations, API, and saved reports
        run: make integration-ci
      - name: Upload application log on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: integration-application-log
          path: /tmp/vector-integration.log
          if-no-files-found: ignore
          retention-days: 7

  container:
    if: needs.classify.outputs.container == 'true'
    name: "Stage 3B: Container Rebuild"
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Rebuild the application image from source
        run: docker build --tag "vector-lab-ci:${GITHUB_SHA}" .

  gate:
    if: always()
    name: "Stage 4: Required PR Gate"
    needs:
      - classify
      - policy
      - quality
      - security_js
      - web_tests
      - rust_tests
      - rust_audit
      - integration
      - container
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      POLICY_RESULT: ${{ needs.policy.result }}
      QUALITY_SELECTED: ${{ needs.classify.outputs.quality }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      SECURITY_JS_SELECTED: ${{ needs.classify.outputs.security_js }}
      SECURITY_JS_RESULT: ${{ needs.security_js.result }}
      WEB_TESTS_SELECTED: ${{ needs.classify.outputs.web_tests }}
      WEB_TESTS_RESULT: ${{ needs.web_tests.result }}
      RUST_TESTS_SELECTED: ${{ needs.classify.outputs.rust_tests }}
      RUST_TESTS_RESULT: ${{ needs.rust_tests.result }}
      RUST_AUDIT_SELECTED: ${{ needs.classify.outputs.rust_audit }}
      RUST_AUDIT_RESULT: ${{ needs.rust_audit.result }}
      INTEGRATION_SELECTED: ${{ needs.classify.outputs.integration }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
      CONTAINER_SELECTED: ${{ needs.classify.outputs.container }}
      CONTAINER_RESULT: ${{ needs.container.result }}
    steps:
      - name: Verify every selected gate passed
        run: |
          set -euo pipefail
          test "${CLASSIFY_RESULT}" = "success"
          test "${POLICY_RESULT}" = "success"
          check_selected() {
            local selected="$1"
            local result="$2"
            local name="$3"
            if [[ "${selected}" == "true" && "${result}" != "success" ]]; then
              echo "Selected gate ${name} ended as ${result}." >&2
              exit 1
            fi
          }
          check_selected "${QUALITY_SELECTED}" "${QUALITY_RESULT}" quality
          check_selected "${SECURITY_JS_SELECTED}" "${SECURITY_JS_RESULT}" security-js
          check_selected "${WEB_TESTS_SELECTED}" "${WEB_TESTS_RESULT}" web-tests
          check_selected "${RUST_TESTS_SELECTED}" "${RUST_TESTS_RESULT}" rust-tests
          check_selected "${RUST_AUDIT_SELECTED}" "${RUST_AUDIT_RESULT}" rust-audit
          check_selected "${INTEGRATION_SELECTED}" "${INTEGRATION_RESULT}" integration
          check_selected "${CONTAINER_SELECTED}" "${CONTAINER_RESULT}" container
          echo "All change-selected policy, quality, security, test, integration, and container gates passed."
