name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    name: Verify reviewed release revision
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.admission.outputs.sha }}
      tag: ${{ steps.admission.outputs.tag }}
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Admit a reviewed semantic-version tag
        id: admission
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --tags --force
          RELEASE_SHA="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          test -n "${RELEASE_SHA}"
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          test "${RELEASE_TAG}" = "v$(git show "${RELEASE_SHA}:package.json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>process.stdout.write(JSON.parse(x).version))')"
          echo "sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
      - name: Check out admitted revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.admission.outputs.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: clippy,rustfmt
      - name: Install and verify
        run: npm ci && make ci-local
      - name: Build release artifacts
        env:
          RELEASE_TAG: ${{ steps.admission.outputs.tag }}
        run: |
          tar -czf "vector-engagement-labs-${RELEASE_TAG}.tar.gz" dist docs engine-rust lib/engine README.md LICENSE NOTICE CHANGELOG.md
          shasum -a 256 "vector-engagement-labs-${RELEASE_TAG}.tar.gz" > SHA256SUMS
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: vector-engagement-labs.spdx.json
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ steps.admission.outputs.tag }}
          path: |
            vector-engagement-labs-*.tar.gz
            SHA256SUMS
            vector-engagement-labs.spdx.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: verify
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-${{ needs.verify.outputs.tag }}
      - name: Attest release archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: vector-engagement-labs-*.tar.gz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: gh release create "${RELEASE_TAG}" vector-engagement-labs-*.tar.gz SHA256SUMS vector-engagement-labs.spdx.json --verify-tag --generate-notes --title "Vector Engagement Labs ${RELEASE_TAG}"
