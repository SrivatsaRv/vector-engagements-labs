name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release
        required: true
        type: string

permissions:
  contents: read
  checks: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    name: Verify reviewed release revision
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_DB: vector
          POSTGRES_USER: vector
          POSTGRES_PASSWORD: vector
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U vector -d vector"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://vector:vector@127.0.0.1:55433/vector
      VECTOR_URL: http://127.0.0.1:4317
      PORT: "4317"
    outputs:
      sha: ${{ steps.admission.outputs.sha }}
      tag: ${{ steps.admission.outputs.tag }}
      image: ${{ steps.admission.outputs.image }}
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Admit a reviewed semantic-version tag
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --tags --force
          RELEASE_SHA="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          test -n "${RELEASE_SHA}"
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          gate_count="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "Stage 4: Required PR Gate" and .conclusion == "success")] | length')"
          test "${gate_count}" -ge 1
          test "${RELEASE_TAG}" = "v$(git show "${RELEASE_SHA}:package.json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>process.stdout.write(JSON.parse(x).version))')"
          echo "sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
      - name: Check out admitted revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.admission.outputs.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.18.0
          cache: npm
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.97.1
          target: wasm32-unknown-unknown
          components: clippy,rustfmt
      - name: Install and verify
        run: npm ci && make ci-local
      - name: Audit locked Rust dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file engine-rust/Cargo.lock
      - name: Verify PostGIS migrations and application integration
        run: |
          npm run build
          make integration-ci
      - name: Set up QEMU for supported image architectures
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Verify the amd64 and arm64 production image build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VECTOR_VERSION=${{ steps.admission.outputs.tag }}
            VECTOR_SOURCE_REVISION=${{ steps.admission.outputs.sha }}
          cache-from: type=gha,scope=vector-release
          cache-to: type=gha,mode=max,scope=vector-release
      - name: Build release artifacts
        env:
          RELEASE_TAG: ${{ steps.admission.outputs.tag }}
        run: |
          tar -czf "vector-engagement-labs-${RELEASE_TAG}.tar.gz" dist docs engine-rust/src engine-rust/Cargo.toml engine-rust/Cargo.lock engine-rust/README.md lib/engine Dockerfile compose.yaml .env.example README.md LICENSE NOTICE CHANGELOG.md
          shasum -a 256 "vector-engagement-labs-${RELEASE_TAG}.tar.gz" > SHA256SUMS
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: vector-engagement-labs.spdx.json
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ steps.admission.outputs.tag }}
          path: |
            vector-engagement-labs-*.tar.gz
            SHA256SUMS
            vector-engagement-labs.spdx.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: verify
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out admitted release revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: Download verified artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-${{ needs.verify.outputs.tag }}
      - name: Set up QEMU for supported image architectures
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Derive immutable image tags and labels
        id: image-metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ needs.verify.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.tag }}
            type=raw,value=sha-${{ needs.verify.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.tag }}
      - name: Publish one immutable multi-architecture image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-metadata.outputs.tags }}
          labels: ${{ steps.image-metadata.outputs.labels }}
          build-args: |
            VECTOR_VERSION=${{ needs.verify.outputs.tag }}
            VECTOR_SOURCE_REVISION=${{ needs.verify.outputs.sha }}
          cache-from: type=gha,scope=vector-release
          provenance: mode=max
          sbom: true
      - name: Verify digest-addressed promotion input
        env:
          VECTOR_IMAGE: ${{ needs.verify.outputs.image }}@${{ steps.image.outputs.digest }}
        run: |
          test -n "${VECTOR_IMAGE}"
          test "${VECTOR_IMAGE#*@sha256:}" != "${VECTOR_IMAGE}"
          ! printf '%s' "${VECTOR_IMAGE}" | grep -q ':latest'
          docker buildx imagetools inspect "${VECTOR_IMAGE}"
          docker compose config --quiet
          printf '%s\n' "${VECTOR_IMAGE}" > IMAGE-DIGEST.txt
      - name: Attest release archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: vector-engagement-labs-*.tar.gz
      - name: Attest published image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ needs.verify.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: gh release create "${RELEASE_TAG}" vector-engagement-labs-*.tar.gz SHA256SUMS vector-engagement-labs.spdx.json IMAGE-DIGEST.txt --verify-tag --generate-notes --title "Vector Engagement Labs ${RELEASE_TAG}"
