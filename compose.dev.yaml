services:
  migrate:
    image: reachdefence/vector-engagement-lab:dev

  vector:
    image: reachdefence/vector-engagement-lab:dev
    build:
      target: development
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "4317"]
    volumes:
      - ./:/app
      - vector_node_modules:/app/node_modules
      - vector_wrangler:/app/.wrangler

volumes:
  vector_node_modules:
